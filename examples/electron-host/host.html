<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>0xramp sandbox host</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
      header { padding: 14px; } iframe { flex: 1; border: 1px solid #ccc; margin: 0 14px 14px; }
    </style>
  </head>
  <body>
    <header>
      <strong>SANDBOX — no real money</strong>
      <p>Powered by 0xramp · P2P.me</p>
      <p id="status">Waiting for sandbox</p>
    </header>
    <iframe id="pane" title="Local sandbox fixture" sandbox="allow-scripts allow-same-origin"></iframe>
    <script>
      "use strict";
      var pane = document.getElementById("pane");
      var status = document.getElementById("status");
      var unsubscribe = window.pspElectron.subscribe(function (event) {
        if (event.kind === "open") pane.src = event.value;
        if (event.kind === "reply" && pane.isConnected) pane.contentWindow.postMessage(event.value, "*"); // local file fixture only
        if (event.kind === "status" || event.kind === "closed") status.textContent = event.value;
        if (event.kind === "closed") pane.remove();
      });
      window.addEventListener("message", function (event) {
        if (pane.isConnected && event.source === pane.contentWindow && event.origin === "null") window.pspElectron.send(event.data);
      });
      window.addEventListener("unload", unsubscribe);
      window.pspElectron.ready();
    </script>
  </body>
</html>
