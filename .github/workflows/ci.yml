name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (pinned)
        run: npm ci
      - name: Typecheck (strict, no emit)
        run: npm run typecheck
      - name: Tests (incl. PSP-v1 fixture parity)
        run: npm test
      - name: Audit (runtime deps)
        run: npm run audit
      - name: Build (ESM + d.ts)
        run: npm run build
      - name: Package contents
        run: npm pack --dry-run

  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: npm publish --dry-run
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
