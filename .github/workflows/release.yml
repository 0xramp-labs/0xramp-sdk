name: Release

# Publishes with provenance from a tagged commit. Run the release gate first:
# version-bump PR + dated CHANGELOG entry + green CI + publish dry-run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish with provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Release gate (tag ↔ package.json version ↔ CHANGELOG)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi
          node -e "
            const fs = require('node:fs');
            const version = require('./package.json').version;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            if (!changelog.includes('## [' + version + ']')) {
              console.error('CHANGELOG.md is missing a ## [' + version + '] entry');
              process.exit(1);
            }
          "
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish (provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
