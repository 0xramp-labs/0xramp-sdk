name: Release

# Release verification for tags. npm publication is DEFERRED — `@0xramp/sdk`
# is not on npm yet (partners install from the repository; README § Install) —
# so this workflow runs the release gate from the tagged commit with no
# registry write: tag ↔ package.json version ↔ dated CHANGELOG entry, plus
# typecheck, tests, build and a publish dry-run (tarball contents only).
#
# When npm publication is unblocked, re-add:
#   - name: Publish (provenance)
#     run: npm publish --provenance --access public
#     env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
# with `id-token: write` in `permissions` and an NPM_TOKEN secret (or npm
# OIDC trusted publishing after the first owner-side publish). Until then
# there is deliberately no publish path and no npm token in this repo.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-release:
    name: verify release (npm publish deferred)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Release gate (tag ↔ package.json version ↔ CHANGELOG)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi
          node -e "
            const fs = require('node:fs');
            const version = require('./package.json').version;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            if (!changelog.includes('## [' + version + ']')) {
              console.error('CHANGELOG.md is missing a ## [' + version + '] entry');
              process.exit(1);
            }
          "
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish dry-run (no registry write)
        run: npm publish --dry-run --access public
